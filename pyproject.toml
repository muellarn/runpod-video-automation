[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runpod-video-automation"
version = "0.1.0"
description = "Provision ephemeral RunPod ComfyUI workers and run video workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
runpod-video = "runpod_video_automation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_video_automation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
