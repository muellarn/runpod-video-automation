---
name: Build worker image

'on':
  workflow_dispatch:
  push:
    paths:
      - .dockerignore
      - .github/workflows/build-worker.yml
      - Dockerfile

permissions:
  contents: read
  packages: write

concurrency:
  group: build-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set GHCR image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image_name="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'name=ghcr.io/%s\n' "$image_name" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.11.1
        uses: >-
          docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        # docker/login-action v3.4.0
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        # docker/metadata-action v5.8.0
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        # docker/build-push-action v6.18.0
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Report image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image digest: %s\n' "$DIGEST"
          printf '### Image digest\n\n%c%s%c\n' \
            96 "$DIGEST" 96 >> "$GITHUB_STEP_SUMMARY"
